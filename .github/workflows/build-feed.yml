name: Build Disney Pin News feed

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  push:
    branches: [main]
    paths:
      - "daily/**"
      - "sources.json"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: python scripts/build_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "pin-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update feed $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
